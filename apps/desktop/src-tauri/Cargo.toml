[workspace]

[package]
name = "nopass-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "nopass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

