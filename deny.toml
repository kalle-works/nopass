# cargo-deny policy. Run: cargo deny check
[graph]
all-features = true

[advisories]
# Vulnerabilities, unsound and yanked crates all fail the check
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are not published and carry no license field
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace crates have no version to pin
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
