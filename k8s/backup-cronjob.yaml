# Nightly encrypted dump (scripts: ops/backup.sh). The Job fails, and
# NopwdBackupFailed fires, when the dump, its decrypt check, the offsite push
# or the offsite verification fails. kube_cronjob_status_last_successful_time
# is the last-success metric: it only advances when every step passed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nopwd-backup
  namespace: nopwd
  labels:
    app.kubernetes.io/name: nopwd-backup
spec:
  schedule: "20 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nopwd-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/kalle-works/nopwd-ops
              imagePullPolicy: IfNotPresent
              command: ["backup.sh"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: nopwd-secrets
                      key: database-url
                - name: BACKUP_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: nopwd-backup-secrets
                      key: passphrase
                - name: OFFSITE_REPO
                  value: git@github.com:kalle-works/nopwd-backups.git
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: known-hosts
                  mountPath: /known-hosts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: nopwd-backups
            - name: secrets
              secret:
                secretName: nopwd-backup-secrets
                defaultMode: 0400
            - name: known-hosts
              configMap:
                name: nopwd-backup-known-hosts
            - name: tmp
              emptyDir: {}
