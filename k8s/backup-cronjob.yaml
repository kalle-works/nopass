# Nightly encrypted dump (scripts: ops/backup.sh). The Job fails, and
# NopwdBackupFailed fires, when pg_dump, the encryption, the offsite push or the
# offsite verification fails. It holds only the age public key, so it cannot
# read its own dumps; the monthly restore drill proves they decrypt. kube_cronjob_status_last_successful_time
# is the last-success metric: it only advances when every step passed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nopwd-backup
  namespace: nopwd
  labels:
    app.kubernetes.io/name: nopwd-backup
spec:
  schedule: "20 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nopwd-backup
        spec:
          restartPolicy: Never
          # nopwd-ops is built for amd64 only; on the arm64 node the pull
          # fails with "no match for platform in manifest".
          nodeSelector:
            kubernetes.io/arch: amd64
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/kalle-works/nopwd-ops
              imagePullPolicy: IfNotPresent
              command: ["backup.sh"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: nopwd-secrets
                      key: database-url
                - name: AGE_RECIPIENT
                  valueFrom:
                    configMapKeyRef:
                      name: nopwd-backup-config
                      key: age-recipient
                - name: OFFSITE_REPO
                  value: git@github.com:kalle-works/nopwd-backups.git
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: known-hosts
                  mountPath: /known-hosts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: nopwd-backups
            # Only the deploy key: this pod must not be able to read the age
            # identity that decrypts the dumps it writes
            - name: secrets
              secret:
                secretName: nopwd-backup-secrets
                defaultMode: 0400
                items:
                  - key: deploy-key
                    path: deploy-key
            - name: known-hosts
              configMap:
                name: nopwd-backup-known-hosts
            - name: tmp
              emptyDir: {}
