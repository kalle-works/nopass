name: Publish images

# Pushing a v* tag builds the api, web and ops images, pushes them to GHCR and
# opens a PR that pins the new release in k8s/kustomization.yaml. Merging that
# PR is the deploy: Flux reconciles ./k8s every 5 minutes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the images (e.g. v0.1.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: nopwd-api image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: crates/nopass-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kalle-works/nopwd-api:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    name: nopwd-web image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nopwd.dev
          tags: ghcr.io/kalle-works/nopwd-web:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  ops:
    name: nopwd-ops image (backup and restore drill)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ops/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kalle-works/nopwd-ops:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,scope=ops,mode=max

  # Needs the repository setting "Allow GitHub Actions to create and approve
  # pull requests". A PR opened with GITHUB_TOKEN does not start CI by itself;
  # the manifests were validated on the tagged commit, and the PR only changes
  # the images block.
  bump:
    name: Open the deploy PR
    runs-on: ubuntu-latest
    needs: [api, web, ops]
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.api.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Pin the release in k8s/kustomization.yaml
        run: |
          scripts/bump-images.sh "$VERSION" \
            "${{ needs.api.outputs.digest }}" \
            "${{ needs.web.outputs.digest }}" \
            "${{ needs.ops.outputs.digest }}"
      - name: Open the PR
        run: |
          BRANCH="release/deploy-$VERSION"
          git config user.name "nopwd-release"
          git config user.email "release@nopwd.dev"
          git switch -c "$BRANCH"
          git add k8s/kustomization.yaml
          git commit -m "chore(release): deploy $VERSION images"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): deploy $VERSION images" \
            --body "Pins the api, web and ops images to the digests built from tag $VERSION. Merging deploys: Flux reconciles ./k8s every 5 minutes."
