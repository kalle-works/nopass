name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nopass_test
          POSTGRES_USER: nopass
          POSTGRES_PASSWORD: nopass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nopass -d nopass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nopass:nopass_test@localhost:5432/nopass_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Advisories (RustSec, including yanked and unsound crates), licenses and
  # registry sources, as configured in deny.toml
  rust-supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Last release's schema plus seeded data, upgraded to the current migrations
  migration-upgrade:
    name: Migration upgrade from the last release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nopass_test
          POSTGRES_USER: nopass
          POSTGRES_PASSWORD: nopass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nopass -d nopass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nopass:nopass_test@localhost:5432/nopass_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/migration-upgrade-test.sh

  ops:
    name: Backup and restore drill scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck ops/*.sh scripts/*.sh
      - run: ops/test.sh
      - run: scripts/bump-images.test.sh
      - run: scripts/check-egress-excepts.sh
      - run: scripts/check-egress-excepts.test.sh
      # Manifests must render and validate, with the release pins applied
      - run: kubectl kustomize k8s > /dev/null

  web:
    name: TypeScript typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build --filter='!@nopass/desktop'

  # Production dependencies only: dev tooling does not ship, and its advisories
  # would block releases without lowering any user's risk
  js-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm audit --prod --audit-level high

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks action needs a paid license for organisation repositories,
      # so the release binary is pinned and checked instead
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks detect --redact --verbose

  # One web e2e job, against the production build: dev mode hides CSP and
  # hydration failures that only the real build shows.
  web-e2e:
    name: Web end-to-end (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nopass_e2e
          POSTGRES_USER: nopass
          POSTGRES_PASSWORD: nopass_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nopass -d nopass_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PRODUCTION: "1"
      E2E_API_URL: http://localhost:4010
      NEXT_PUBLIC_API_URL: http://localhost:4010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p nopass-api
      - name: Start API
        env:
          DATABASE_URL: postgres://nopass:nopass_e2e@localhost:5432/nopass_e2e
          NOPASS_EMAIL_LOOKUP_KEY: ZTJlLW9ubHktZW1haWwtbG9va3VwLWtleS0zMi1ieXRlcyE=
          NOPASS_ALLOWED_ORIGINS: http://localhost:4020
          NOPASS_PORT: "4010"
          # Every test signs in from one IP; the production limit would 429 them
          NOPASS_AUTH_RATE_LIMIT_PER_MIN: "1000"
        run: |
          NOPASS_OPAQUE_SERVER_SETUP=$(target/debug/nopass-api generate-opaque-setup) target/debug/nopass-api > api.log 2>&1 &
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://localhost:4010/v1/health
      - run: pnpm turbo run build --filter=@nopass/web
      - run: pnpm --filter @nopass/web exec playwright install --with-deps chromium
      - run: pnpm --filter @nopass/web test:e2e
      - if: failure()
        run: cat api.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results
          path: apps/web/test-results

  extension-e2e:
    name: Extension end-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nopass_e2e
          POSTGRES_USER: nopass
          POSTGRES_PASSWORD: nopass_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nopass -d nopass_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='@nopass/extension^...'
      - run: pnpm --filter @nopass/extension exec playwright install --with-deps chromium
      - run: cargo build -p nopass-api
      - name: Start API
        env:
          DATABASE_URL: postgres://nopass:nopass_e2e@localhost:5432/nopass_e2e
          NOPASS_EMAIL_LOOKUP_KEY: ZTJlLW9ubHktZW1haWwtbG9va3VwLWtleS0zMi1ieXRlcyE=
          NOPASS_ALLOWED_ORIGINS: http://localhost:3000
          NOPASS_PORT: "3001"
        run: |
          NOPASS_OPAQUE_SERVER_SETUP=$(target/debug/nopass-api generate-opaque-setup) target/debug/nopass-api > api.log 2>&1 &
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3001/v1/health
      - run: pnpm --filter @nopass/extension build
      # The suite skips itself when the API, the build or the browser is
      # missing, so a green run alone proves nothing: require real passes.
      - name: Run extension e2e
        working-directory: apps/extension
        run: pnpm exec vitest run --config vitest.e2e.config.ts --reporter=json --outputFile=e2e-results.json
      - name: Require that the e2e tests ran
        working-directory: apps/extension
        run: |
          jq -e '.numPassedTests > 0 and .numPendingTests == 0 and .numFailedTests == 0' e2e-results.json
      - if: failure()
        run: cat api.log

  extension-package:
    name: Extension package (store artifact)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/package-extension.sh https://api.nopwd.dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nopwd-extension
          path: apps/extension/nopwd-extension.zip
