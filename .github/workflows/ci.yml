name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nopass_test
          POSTGRES_USER: nopass
          POSTGRES_PASSWORD: nopass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nopass -d nopass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nopass:nopass_test@localhost:5432/nopass_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  web:
    name: TypeScript typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build --filter='!@nopass/desktop'

  extension-package:
    name: Extension package (store artifact)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/package-extension.sh https://api.nopwd.dev
      - uses: actions/upload-artifact@v4
        with:
          name: nopwd-extension
          path: apps/extension/nopwd-extension.zip
