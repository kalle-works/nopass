[workspace]
resolver = "2"
members = [
    "crates/nopass-crypto",
    "crates/nopass-models",
    "crates/nopass-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header", "request-id"] }
tower = { version = "0.5", features = ["util"] }
governor = "0.6"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"

# SRP (Secure Remote Password) — legacy login, kept only for accounts not yet migrated to OPAQUE
srp = "0.6"

# OPAQUE aPAKE (RFC 9807). Must stay wire-compatible with @serenity-kit/opaque on the clients.
opaque-ke = { version = "=4.0.1", features = ["argon2"] }

# HTTP client (used by Stripe integration)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Metrics (text exposition only, no protobuf)
prometheus = { version = "=0.14.0", default-features = false }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"

# Argon2id at debug opt-level makes every OPAQUE login in tests take seconds.
[profile.dev.package.argon2]
opt-level = 3
